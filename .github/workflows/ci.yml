name: MarketPulse CI/CD Quality Gate

on:
  push:
    branches: [ main, marketpulse-ai ]
  pull_request:
    branches: [ main, marketpulse-ai ]

jobs:
  quality-gate:
    name: 66-Test Audit Suite & Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: marketpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: ${{ github.workspace }}/marketpulse
      # Fallback dummy environment variables for CI testing without exposing secrets
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || 'test_nvapi_key_dummy' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || 'test_openrouter_key_dummy' }}
      API_KEY: ${{ secrets.API_KEY || 'test_api_key_dummy' }}
      DATABASE_URL: "postgresql+asyncpg://postgres:test@localhost:5432/marketpulse_test"
      LOG_LEVEL: "INFO"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip & Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax & Compilation Check
        run: |
          echo "Verifying Python syntax across marketpulse codebase..."
          python -m compileall -q marketpulse/app marketpulse/tests

      - name: Run Full 66-Test Matrix & Audit Suite
        run: |
          echo "Running all 66 test cases (Audit Matrix, Guardrails, Concurrency, Unit, Stats)..."
          python -m pytest marketpulse/tests -v --tb=short | tee pytest_output.log

      - name: Upload Pytest Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-test-logs
          path: pytest_output.log
          retention-days: 7

      - name: Dependency Vulnerability Scan (Non-blocking)
        run: |
          pip install pip-audit
          pip-audit || echo "::warning::pip-audit detected potential dependency vulnerabilities"
