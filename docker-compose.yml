version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: marketpulse_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: marketpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketpulse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketpulse_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg2://postgres:postgrespassword@db:5432/marketpulse"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      LOG_LEVEL: "INFO"
      ENVIRONMENT: "production"

volumes:
  postgres_data:
    driver: local
